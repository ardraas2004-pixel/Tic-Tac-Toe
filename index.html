<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe GAME</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <div id="board">
        <div data-index="1" class=" tile right-border bottom-border"></div>
        <div data-index="2" class=" tile right-border bottom-border"></div>
        <div data-index="3" class=" tile bottom-border"></div>
        <div data-index="4" class=" tile right-border bottom-border"></div>
        <div data-index="5" class=" tile right-border bottom-border"></div>
        <div data-index="6" class="tile bottom-border"></div>
        <div data-index="7" class="tile right-border "></div>
        <div data-index="8" class="tile right-border "></div>
        <div data-index="9" class="tile "></div>
        <div id="strike" class="strike"></div>

    </div>
    <div id="game-over-area" class="hidden">
        <h2 id="game-over-text">Winner is X</h2>
        <button id="play-again">Play Again</button>
    </div>
</body>
<script>

const tiles = document.querySelectorAll(".tile");
const strike = document.getElementById("strike");
const gameOverArea = document.getElementById("game-over-area");
const gameOverText = document.getElementById("game-over-text");
const playAgainButton = document.getElementById("play-again");


let currentPlayer = "X";
let gameActive = true;
let board = ["", "", "", "", "", "", "", "", ""];

const winningCombinations = [
    { combination: [0, 1, 2], strikeClass: "strike-row-1" },
    { combination: [3, 4, 5], strikeClass: "strike-row-2" },
    { combination: [6, 7, 8], strikeClass: "strike-row-3" },
    { combination: [0, 3, 6], strikeClass: "strike-column-1" },
    { combination: [1, 4, 7], strikeClass: "strike-column-2" },
    { combination: [2, 5, 8], strikeClass: "strike-column-3" },
    { combination: [0, 4, 8], strikeClass: "strike-diagonal-1" },
    { combination: [2, 4, 6], strikeClass: "strike-diagonal-2" }
];
const wins = winningCombinations.map(function(item) {
    return item.combination;
});
const lines = winningCombinations.map(function(item) {
    return item.strikeClass;
});
tiles.forEach(function(tile, index) {
   tile.onclick = function() {
       if (board[index] == "" && gameActive == true) {
           board[index] = currentPlayer;
            tile.innerHTML = currentPlayer;
          if (checkWinner()) {
                gameOverText.innerHTML = "Winner is " + currentPlayer;
                gameOverArea.classList.remove("hidden");
                gameActive = false;

            } else if (!board.includes("")) {
                gameOverText.innerHTML = "It's a Draw!";
                gameOverArea.classList.remove("hidden");
                gameActive = false;
            } else {
             if (currentPlayer == "X") {
                    currentPlayer = "O";
                } else {
                    currentPlayer = "X";
                }}
             }};
            });


function checkWinner() {
      for (let i = 0; i < wins.length; i++) {
        let a = wins[i][0];
        let b = wins[i][1];
        let c = wins[i][2];
       if (board[a] == currentPlayer &&
            board[b] == currentPlayer &&
            board[c] == currentPlayer
        ) { strike.className = "strike " + lines[i];
            return true;
        }
    }
    return false;
}
playAgainButton.onclick = function() {
    board = ["", "", "", "", "", "", "", "", ""];
    currentPlayer = "X";
    gameActive = true;
   tiles.forEach(function(tile) {
        tile.innerHTML = "";
    });
    gameOverArea.classList.add("hidden");
    strike.className = "strike";
};

</script>
</html>
